<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Dining Budget Tracker</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
            }
          }
        }
      }
    }
  </script>
  
  <!-- Chart.js for Visual Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.4);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(156, 163, 175, 0.6);
    }
  </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans antialiased transition-colors duration-200">

  <div class="min-h-full flex flex-col">
    <!-- Navigation Header -->
    <header class="sticky top-0 z-30 bg-white/90 dark:bg-slate-800/90 backdrop-blur border-b border-slate-200 dark:border-slate-700">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="p-2 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 rounded-xl">
            <i data-lucide="utensils" class="w-6 h-6"></i>
          </div>
          <div>
            <h1 class="font-bold text-lg leading-tight text-slate-900 dark:text-white">Dining Dollars</h1>
            <p class="text-xs text-slate-500 dark:text-slate-400">Campus Budget Tracker</p>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <!-- Dark/Light Theme Toggle -->
          <button id="themeToggleBtn" onclick="toggleTheme()" class="p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition" title="Toggle Theme">
            <i id="themeIcon" data-lucide="moon" class="w-5 h-5"></i>
          </button>

          <!-- Sync/Data Backup Button -->
          <button onclick="openSyncModal()" class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 transition">
            <i data-lucide="arrow-right-left" class="w-4 h-4"></i>
            <span class="hidden sm:inline">Backup & Sync</span>
          </button>

          <!-- Settings Button -->
          <button onclick="openSettingsModal()" class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 transition">
            <i data-lucide="settings" class="w-4 h-4"></i>
            <span class="hidden sm:inline">Term Config</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Body Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

      <!-- Metrics / Stats Cards Grid -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        
        <!-- Target Daily Allowance Card -->
        <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm relative overflow-hidden">
          <div class="flex items-center justify-between text-slate-500 dark:text-slate-400 text-sm font-medium">
            <span>Daily Target</span>
            <i data-lucide="target" class="w-4 h-4 text-indigo-500"></i>
          </div>
          <div class="mt-2 flex items-baseline gap-2">
            <span id="statDailyBudget" class="text-3xl font-extrabold text-slate-900 dark:text-white">$0.00</span>
            <span class="text-xs text-slate-500 dark:text-slate-400">/ day</span>
          </div>
          <p id="statDailyDaysSubtext" class="mt-1 text-xs text-slate-500 dark:text-slate-400">Based on remaining balance</p>
        </div>

        <!-- Today's Spending & Pace Card -->
        <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
          <div class="flex items-center justify-between text-slate-500 dark:text-slate-400 text-sm font-medium">
            <span>Spent Today</span>
            <span id="statPaceBadge" class="px-2 py-0.5 text-xs rounded-full font-semibold bg-emerald-100 text-emerald-800 dark:bg-emerald-900/50 dark:text-emerald-300">On Track</span>
          </div>
          <div class="mt-2 flex items-baseline gap-2">
            <span id="statSpentToday" class="text-3xl font-extrabold text-slate-900 dark:text-white">$0.00</span>
          </div>
          <div class="w-full bg-slate-200 dark:bg-slate-700 h-2 rounded-full mt-3 overflow-hidden">
            <div id="statTodayProgress" class="bg-indigo-600 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
          </div>
        </div>

        <!-- Remaining Account Balance Card -->
        <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
          <div class="flex items-center justify-between text-slate-500 dark:text-slate-400 text-sm font-medium">
            <span>Remaining Balance</span>
            <i data-lucide="wallet" class="w-4 h-4 text-emerald-500"></i>
          </div>
          <div class="mt-2">
            <span id="statRemainingBalance" class="text-3xl font-extrabold text-slate-900 dark:text-white">$0.00</span>
          </div>
          <div class="mt-2 flex items-center justify-between text-xs text-slate-500 dark:text-slate-400">
            <span>Start: <span id="statInitialBalance">$0</span></span>
            <span id="statPercentRemaining">100% left</span>
          </div>
        </div>

        <!-- Days Left in Term Card -->
        <div class="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
          <div class="flex items-center justify-between text-slate-500 dark:text-slate-400 text-sm font-medium">
            <span>Days Remaining</span>
            <i data-lucide="calendar" class="w-4 h-4 text-amber-500"></i>
          </div>
          <div class="mt-2 flex items-baseline gap-2">
            <span id="statDaysLeft" class="text-3xl font-extrabold text-slate-900 dark:text-white">0</span>
            <span class="text-xs text-slate-500 dark:text-slate-400">days</span>
          </div>
          <p id="statWeekendNotice" class="mt-1 text-xs text-slate-500 dark:text-slate-400">Ends: <span id="statEndDate">--</span></p>
        </div>

      </div>

      <!-- Main Interactive Section: Quick Expense Entry + Recent Log -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Left Column: Quick Entry Form -->
        <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
          <h2 class="text-base font-bold text-slate-900 dark:text-white flex items-center gap-2">
            <i data-lucide="plus-circle" class="w-5 h-5 text-indigo-500"></i>
            Log Dining Expense
          </h2>

          <form id="expenseForm" onsubmit="handleExpenseSubmit(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">Meal Title / Item</label>
              <input type="text" id="expName" placeholder="e.g. Dining Hall, Vending Machine" required
                class="w-full px-3 py-2 text-sm bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:text-white">
              
              <!-- Quick Preset Title Buttons -->
              <div class="mt-2">
                <span class="block text-[11px] font-medium text-slate-500 dark:text-slate-400 mb-
